# שומר את השרת החינמי ב-Render ער (הוא נרדם אחרי 15 דקות בלי פניות),
# כדי שהבוט יענה מיד ולא אחרי דקה.
name: keep-awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://koneh-ishi.onrender.com/ | head -3
